name: SenseNova Instruct Profile Smoke Test

on:
  push:
    branches:
      - experiment/sensenova-instruct-profile
    paths:
      - 'sensenova_runner.py'
      - 'tests/sensenova_instruct_smoke_test.py'
      - 'tests/sensenova_full_input_validation.py'
      - 'main.py'
      - 'fundamentals.py'
      - 'daily_memory.py'
      - 'zone_lifecycle.py'
      - 'test_*.py'
      - 'lifecycle_contract.py'
      - '.github/workflows/sensenova-instruct-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensenova-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore 24-hour market memory
        uses: actions/cache/restore@v4
        with:
          path: .cache/daily_market_memory.json
          key: daily-market-memory-${{ github.run_id }}
          restore-keys: |
            daily-market-memory-

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Install full test runner
        run: python -m pip install pytest

      - name: Run complete repository regression suite
        run: python -m pytest -q

      - name: Validate full production prompt, live charts and market context (no publication)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        run: python tests/sensenova_full_input_validation.py
