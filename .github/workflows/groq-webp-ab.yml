name: Groq PNG vs WEBP Token A-B (live)

on:
  push:
    branches:
      - experiment/groq-webp-ab
    paths:
      - "tests/groq_webp_ab_validation.py"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/groq-webp-ab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-image-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run identical-input PNG vs WEBP Groq test
        run: python tests/groq_webp_ab_validation.py
