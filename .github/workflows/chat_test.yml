name: Telegram Chat Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: telegram-chat-preview
  cancel-in-progress: false

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check chat script syntax
        run: python -m py_compile telegram_chat_test.py
      - name: Install HTTP client
        run: pip install requests==2.32.5
      - name: Chat for about 10 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u telegram_chat_test.py
