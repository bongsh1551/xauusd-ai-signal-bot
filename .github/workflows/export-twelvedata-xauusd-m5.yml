name: Export Twelve Data XAUUSD M5 History

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/export_twelvedata_xauusd_m5.py'
      - 'tools/test_export_twelvedata_xauusd_m5.py'
      - '.github/workflows/export-twelvedata-xauusd-m5.yml'
  workflow_dispatch:
    inputs:
      outputsize:
        description: "Number of recent M5 candles to test"
        required: true
        default: "500"
        type: choice
        options:
          - "300"
          - "500"
      start_date:
        description: "Historical comparison start date (UTC), YYYY-MM-DD"
        required: false
        default: "2026-10-12"
        type: string
      end_date:
        description: "Historical comparison end date (UTC), YYYY-MM-DD"
        required: false
        default: "2026-10-12"
        type: string

permissions:
  contents: read

jobs:
  export-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exporter dependency
        run: pip install "requests>=2.32,<3"
      - name: Run offline exporter tests
        run: python -m unittest -v tools.test_export_twelvedata_xauusd_m5
      - name: Probe earliest timestamp and export recent M5 candles
        if: github.event_name == 'workflow_dispatch'
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TWELVEDATA_API_KEY_2: ${{ secrets.TWELVEDATA_API_KEY_2 }}
        run: >-
          python tools/export_twelvedata_xauusd_m5.py
          --outputsize "${{ inputs.outputsize }}"
          --start-date "${{ inputs.start_date }}"
          --end-date "${{ inputs.end_date }}"
          --out-dir twelvedata_export
      - name: Upload CSV and lookback report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-TwelveData-M5-Lookback-${{ inputs.outputsize }}
          path: twelvedata_export/
          if-no-files-found: error
          retention-days: 14
