name: Diagnose XAUUSD Schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose_schedule.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read schedule state and report
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.parse, urllib.request
          repo = os.environ['REPO']
          def read(path):
              req = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError('GitHub read HTTP ' + str(exc.code)) from None
          now = datetime.datetime.now(datetime.timezone.utc)
          lines = ['🔎 XAUUSD 自动调度诊断（只读）',
                   '检查时间 UTC：' + now.isoformat()]
          try:
              info = read('')
              workflow = read('/actions/workflows/run.yml')
              scheduled = read('/actions/workflows/run.yml/runs?event=schedule&per_page=5')
              recent = read('/actions/workflows/run.yml/runs?per_page=3')
              lines += ['默认分支：' + str(info.get('default_branch')),
                        '工作流状态：' + str(workflow.get('state')),
                        '工作流路径：' + str(workflow.get('path')),
                        '自动 schedule 记录总数：' + str(scheduled.get('total_count'))]
              def describe(run):
                  return ' | '.join(str(run.get(k)) for k in
                      ('id', 'event', 'status', 'conclusion', 'created_at'))
              runs = scheduled.get('workflow_runs', [])
              lines.append('最近自动运行（ID | event | status | conclusion | UTC）：')
              lines += [describe(run) for run in runs] or ['没有返回自动运行记录']
              lines.append('最近全部运行：')
              lines += [describe(run) for run in recent.get('workflow_runs', [])]
              if workflow.get('state') != 'active':
                  lines.append('待处理：工作流并非 active；本诊断不自动启用或修改。')
              elif not runs:
                  lines.append('待处理：已启用但未返回 schedule 记录；原因仍需排查。')
              else:
                  lines.append('已取得自动运行记录；需结合时间与结果判断是否持续更新。')
          except Exception as exc:
              detail = str(exc) if isinstance(exc, RuntimeError) else type(exc).__name__
              lines.append('诊断未完成：' + detail)
          lines.append('此诊断不运行行情分析、不更新计划、不修改安全闸。')
          text = '\n'.join(lines)
          print(text)
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not token or not chat_id:
              raise SystemExit('Telegram configuration missing; report is in Actions log')
          payload = urllib.parse.urlencode({'chat_id': chat_id, 'text': text}).encode()
          req = urllib.request.Request('https://api.telegram.org/bot' + token + '/sendMessage', data=payload)
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  result = json.load(response)
              if result.get('ok') is not True:
                  raise RuntimeError('Telegram report rejected')
          except Exception:
              raise SystemExit('Telegram report delivery failed; read Actions log') from None
          PY
