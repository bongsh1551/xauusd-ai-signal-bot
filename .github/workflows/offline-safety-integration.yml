name: Offline Safety and Delivery Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'publication_guard.py'
      - 'test_publication_guard_runtime.py'
      - 'zone_lifecycle.py'
      - 'lifecycle_contract.py'
      - 'test_zone_lifecycle.py'
      - 'test_lifecycle_contract.py'
      - 'cloudflare/**'
      - '.github/workflows/offline-safety-integration.yml'
  push:
    branches: [experiment/sensenova-instruct-profile]
    paths:
      - 'publication_guard.py'
      - 'test_publication_guard_runtime.py'
      - 'zone_lifecycle.py'
      - 'lifecycle_contract.py'
      - 'test_zone_lifecycle.py'
      - 'test_lifecycle_contract.py'
      - 'cloudflare/**'
      - '.github/workflows/offline-safety-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Test lifecycle and publication guard
        run: python -m pytest -q test_zone_lifecycle.py test_lifecycle_contract.py test_publication_guard_runtime.py
      - name: Test Cloudflare opportunity candidate gates
        run: node cloudflare/test_opportunity_alerts.mjs
      - name: Test mocked Cloudflare to Telegram delivery
        run: node cloudflare/test_opportunity_delivery.mjs
