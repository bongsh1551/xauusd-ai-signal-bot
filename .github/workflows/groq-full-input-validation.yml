name: Groq Full Input Vision Validation

on:
  push:
    branches:
      - experiment/sensenova-instruct-profile
    paths:
      - 'tests/groq_full_input_validation.py'
      - '.github/workflows/groq-full-input-validation.yml'
      - 'main.py'
      - 'prompts/scalper.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-full-input-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install production dependencies
        run: python -m pip install -r requirements.txt

      - name: Run repository regression suite
        run: |
          python -m pip install pytest
          python -m pytest -q

      - name: Run full production-input Groq vision test (no publication)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tests/groq_full_input_validation.py
