name: Market Memory Tests

on:
  pull_request:
    paths:
      - 'daily_memory.py'
      - 'test_daily_memory.py'
      - 'main.py'
      - 'sensenova_runner.py'
      - 'fundamentals.py'
      - 'test_market_memory_pipeline.py'
      - 'test_shadow_mode.py'
      - 'publication_guard.py'
      - 'test_market_data_quality.py'
      - 'test_fundamentals_cache.py'
      - 'test_sensenova_validation.py'
      - 'prompts/scalper.txt'
      - '.github/workflows/test-market-memory.yml'
      - '.github/workflows/run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q daily_memory.py fundamentals.py main.py sensenova_runner.py sensenova_transport.py publication_guard.py test_shadow_mode.py
      - name: Run complete offline regression suite
        run: python -m unittest -v test_daily_memory test_market_data_quality test_fundamentals_cache test_sensenova_validation test_market_memory_pipeline test_shadow_mode
