name: Groq Vision Connectivity Test

on:
  push:
    branches:
      - experiment/sensenova-instruct-profile
    paths:
      - 'tests/groq_vision_smoke_test.py'
      - '.github/workflows/groq-vision-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  groq-vision-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install HTTP client
        run: python -m pip install requests

      - name: Test Groq API key and three-image vision request (no publication)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python tests/groq_vision_smoke_test.py
