name: XAUUSD AI Signal Bot

# Minimal schedule re-registration: no logic changed.

on:
  schedule:
        - cron: '0-59/5 0-14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: goldscalp-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore hourly FX cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/fx_strength.json
          key: fx-strength-${{ github.run_id }}
          restore-keys: |
            fx-strength-

      - name: Restore zone lifecycle state
        uses: actions/cache/restore@v4
        with:
          path: .cache/zone_lifecycle_state.json
          key: zone-lifecycle-${{ github.run_id }}
          restore-keys: |
            zone-lifecycle-

      - name: Restore 24-hour market memory
        uses: actions/cache/restore@v4
        with:
          path: .cache/daily_market_memory.json
          key: daily-market-memory-${{ github.run_id }}
          restore-keys: |
            daily-market-memory-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test analysis pipeline
        run: python -m unittest -v test_daily_memory test_analysis_ingest test_sensenova_transport test_twelvedata_retry

      - name: Verify chart imports
        run: python -c "import six; import mplfinance; import sensenova_runner"

      - name: Run XAUUSD manual signal analysis
        id: signal_bot
        env:
          ANALYSIS_MODE: manual_signals
          MARKET_MEMORY_MODE: manual_signals
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          PLAN_UPDATE_TOKEN: ${{ secrets.PLAN_UPDATE_TOKEN }}
        run: python publication_guard.py

      - name: Save zone lifecycle state
        if: always() && hashFiles('.cache/zone_lifecycle_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/zone_lifecycle_state.json
          key: zone-lifecycle-${{ github.run_id }}

      - name: Save 24-hour market memory
        if: always() && hashFiles('.cache/daily_market_memory.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/daily_market_memory.json
          key: daily-market-memory-${{ github.run_id }}

      - name: Save refreshed hourly FX cache
        if: always() && hashFiles('.cache/fx_strength.updated') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/fx_strength.json
          key: fx-strength-${{ github.run_id }}

      - name: Upload analysis journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-analysis-journal-${{ github.run_id }}
          path: journal/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload run replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-run-replay-${{ github.run_id }}
          path: .cache/run_replay/
          if-no-files-found: ignore
          retention-days: 7

  notify_failure:
    needs: analyze
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          run_id = '${{ github.run_id }}'
          run_url = 'https://github.com/${{ github.repository }}/actions/runs/' + run_id
          text = (
              '❌ XAUUSD 分析失败\n\n'
              'Run ID: ' + run_id + '\n'
              '仓库: ${{ github.repository }}\n'
              '时间: ' + '${{ github.event.head_commit.timestamp }}' + '\n'
              '请检查 GitHub Actions 日志。\n'
              + run_url
          )
          data = urllib.parse.urlencode({'chat_id': chat_id, 'text': text}).encode()
          req = urllib.request.Request('https://api.telegram.org/bot{token}/sendMessage'.format(token=token), data=data)
          urllib.request.urlopen(req, timeout=30)
          PY
