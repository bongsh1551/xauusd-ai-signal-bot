name: SenseNova Production Pipeline Dry Run
on:
  push:
    branches:
      - experiment/sensenova-full-payload-validation
    paths:
      - publication_guard.py
      - test_full_pipeline_dry_run.py
      - .github/workflows/sensenova-full-payload-validation.yml
permissions:
  contents: read
jobs:
  production-pipeline-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore 24-hour market memory
        uses: actions/cache/restore@v4
        with:
          path: .cache/daily_market_memory.json
          key: daily-market-memory-${{ github.run_id }}
          restore-keys: |
            daily-market-memory-
      - name: Restore FX cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/fx_strength.json
          key: fx-strength-${{ github.run_id }}
          restore-keys: |
            fx-strength-
      - name: Restore zone lifecycle state
        uses: actions/cache/restore@v4
        with:
          path: .cache/zone_lifecycle_state.json
          key: zone-lifecycle-${{ github.run_id }}
          restore-keys: |
            zone-lifecycle-
      - name: Install project dependencies
        run: pip install -r requirements.txt
      - name: Run production unit tests
        run: python -m unittest -v test_daily_memory test_analysis_ingest test_sensenova_transport
      - name: Verify production imports
        run: python -c "import six; import mplfinance; import sensenova_runner; import publication_guard"
      - name: Run official pipeline with publication intercepted
        env:
          ANALYSIS_MODE: manual_signals
          MARKET_MEMORY_MODE: manual_signals
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          # These are required non-empty config fields but are never used by this dry-run:
          TELEGRAM_BOT_TOKEN: DRY_RUN_NOT_USED
          TELEGRAM_CHAT_ID: DRY_RUN_NOT_USED
          PLAN_UPDATE_TOKEN: DRY_RUN_NOT_USED
        run: python -u test_full_pipeline_dry_run.py
      - name: Upload dry-run journal and replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-production-pipeline-dry-run-${{ github.run_id }}
          path: |
            journal/
            .cache/run_replay/
          if-no-files-found: ignore
          retention-days: 14
